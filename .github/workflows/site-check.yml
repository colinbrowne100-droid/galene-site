name: Daily site check
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check
        id: run
        run: |
          python3 tools/site_check.py | tee report.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: Open or update issue on failure
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Site check failed: $(date -u +%d\ %b\ %Y)"
          n=$(gh issue list --label site-check --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file report.txt; else gh issue create --title "$title" --label site-check --body-file report.txt; fi
